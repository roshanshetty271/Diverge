AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Diverge — Decision intelligence engine.
  Team Sic Mundus | AWS 10,000 AIdeas Competition

Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: python3.12
    Environment:
      Variables:
        DIVERGE_AWS_REGION: !Ref AWS::Region
        DIVERGE_MODEL_PROVIDER: !Ref ModelProvider
        DIVERGE_DEBATE_MODEL_ID: !Ref DebateModelId
        DIVERGE_METRICS_MODEL_ID: !Ref MetricsModelId
        DIVERGE_OPENAI_API_KEY: !Ref OpenAIApiKey
        DIVERGE_COMPREHEND_ENABLED: !Ref EnableComprehend
        DIVERGE_DEBUG: "false"
        DIVERGE_RATE_LIMITING_ENABLED: "true"
        DIVERGE_PUBLIC_APP_URL: !Ref PublicAppUrl
        DIVERGE_TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  OpenAIApiKey:
    Type: String
    Default: ""
    NoEcho: true
  TurnstileSecretKey:
    Type: String
    Default: ""
    NoEcho: true
  ModelProvider:
    Type: String
    Default: "openai"
    AllowedValues: ["openai", "bedrock"]
  DebateModelId:
    Type: String
    Default: "gpt-4o-mini"
  MetricsModelId:
    Type: String
    Default: "gpt-4o-mini"
  EnableComprehend:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableCloudFront:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  PublicAppUrl:
    Type: String
    Default: ""
  # Custom domain (optional). Leave blank to use the default *.cloudfront.net URL.
  # Example: DomainName=diverge.app, HostedZoneId=Z123ABC (from Route 53).
  DomainName:
    Type: String
    Default: ""
  HostedZoneId:
    Type: String
    Default: ""
  # Cost guardrails. Lower = safer; raise only if you expect more traffic.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    Description: Monthly USD budget cap. Email alerts fire at 50%, 80%, and 100% forecasted.
  AlertEmail:
    Type: String
    Default: ""
    Description: Email for budget + Lambda + Bedrock alarm notifications. Leave blank to skip the email subscription and budget emails.
  MaxConcurrentDebates:
    Type: Number
    Default: 30
    Description: Reserved concurrency cap on DebateFunction. Set to 0 to disable. Bump higher (e.g. 100) via -MaxConcurrentDebates flag if going viral. Requires account Lambda concurrency >= MaxConcurrentDebates + 10.

Conditions:
  CreateCloudFront: !Equals [!Ref EnableCloudFront, "true"]
  HasPublicAppUrl: !Not [!Equals [!Ref PublicAppUrl, ""]]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasHostedZone: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  EnableConcurrencyCap: !Not [!Equals [!Ref MaxConcurrentDebates, 0]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ── Cognito ────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: diverge-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  # After deploy, add CloudFront URL to Cognito via Console:
  #   Cognito → diverge-users → App client → Edit hosted UI
  #   Add https://YOUR_CLOUDFRONT_DOMAIN to Callback + Logout URLs
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: diverge-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:5173
        - !If [HasPublicAppUrl, !Ref PublicAppUrl, !Ref "AWS::NoValue"]
      LogoutURLs:
        - http://localhost:5173
        - !If [HasPublicAppUrl, !Ref PublicAppUrl, !Ref "AWS::NoValue"]
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub diverge-${AWS::AccountId}
      UserPoolId: !Ref UserPool

  # ── DynamoDB ───────────────────────────────────────────────────
  DebatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: diverge-debates
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: debate_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: debate_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-debates-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: diverge-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  CheckinsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: diverge-checkins
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: checkin_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: send_at
          AttributeType: N
      KeySchema:
        - AttributeName: checkin_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-send-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: send_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Lambda: Debate (long-running, uses Function URL) ───────────
  DebateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: diverge-debate
      CodeUri: backend/
      Handler: lambda_handler.handler
      Timeout: 300
      MemorySize: 1024
      Tracing: Active
      ReservedConcurrentExecutions: !If
        - EnableConcurrencyCap
        - !Ref MaxConcurrentDebates
        - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          DIVERGE_DEBATES_TABLE: !Ref DebatesTable
          DIVERGE_USERS_TABLE: !Ref UsersTable
          DIVERGE_COGNITO_USER_POOL_ID: !Ref UserPool
          DIVERGE_COGNITO_CLIENT_ID: !Ref UserPoolClient
          DIVERGE_ORIGIN_VERIFY_HEADER: !If [CreateCloudFront, "x-origin-verify", ""]
          DIVERGE_ORIGIN_VERIFY_SECRET: !If [CreateCloudFront, !Sub "diverge-${AWS::AccountId}-origin-secret", ""]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DebatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ApplyGuardrail
              Resource:
                # Foundation models — wildcard region because us.* inference profiles
                # route invocations across us-east-1, us-east-2, and us-west-2.
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:*::foundation-model/us.amazon.nova-pro-v1:0"
                - "arn:aws:bedrock:*::foundation-model/us.amazon.nova-lite-v1:0"
                - "arn:aws:bedrock:*::foundation-model/us.anthropic.claude-sonnet-4-20250514-v1:0"
                # Inference profiles are account-scoped to the region they were created in.
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-pro-v1:0"
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0"
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action:
                - comprehend:DetectSentiment
                - comprehend:BatchDetectSentiment
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

  # ── Lambda: REST API (templates, journal, health) ──────────────
  RestApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: diverge-rest
      CodeUri: backend/
      Handler: lambda_handler.handler
      Timeout: 29
      MemorySize: 512
      Tracing: Active
      Environment:
        Variables:
          DIVERGE_DEBATES_TABLE: !Ref DebatesTable
          DIVERGE_USERS_TABLE: !Ref UsersTable
          DIVERGE_CHECKINS_TABLE: !Ref CheckinsTable
          DIVERGE_CHECKINS_SCHEDULER_ENABLED: "true"
          DIVERGE_COGNITO_USER_POOL_ID: !Ref UserPool
          DIVERGE_COGNITO_CLIENT_ID: !Ref UserPoolClient
      Events:
        Health:
          Type: Api
          Properties:
            Path: /api/health
            Method: get
            RestApiId: !Ref ApiGateway
        Capabilities:
          Type: Api
          Properties:
            Path: /api/capabilities
            Method: get
            RestApiId: !Ref ApiGateway
        Templates:
          Type: Api
          Properties:
            Path: /api/templates
            Method: get
            RestApiId: !Ref ApiGateway
        Journal:
          Type: Api
          Properties:
            Path: /api/journal
            Method: get
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuth
        SaveDebate:
          Type: Api
          Properties:
            Path: /api/debate/save
            Method: post
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuth
        ShareDebate:
          Type: Api
          Properties:
            Path: /api/debate/share
            Method: post
            RestApiId: !Ref ApiGateway
        GetShared:
          Type: Api
          Properties:
            Path: /api/debate/shared/{share_id}
            Method: get
            RestApiId: !Ref ApiGateway
        ChoosePath:
          Type: Api
          Properties:
            Path: /api/debate/{debate_id}/choose
            Method: post
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuth
        Reflect:
          Type: Api
          Properties:
            Path: /api/debate/{debate_id}/reflect
            Method: post
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: CognitoAuth
        Checkin:
          Type: Api
          Properties:
            Path: /api/checkin
            Method: post
            RestApiId: !Ref ApiGateway
        EmailResults:
          Type: Api
          Properties:
            Path: /api/email-results
            Method: post
            RestApiId: !Ref ApiGateway
        Tts:
          Type: Api
          Properties:
            Path: /api/tts
            Method: post
            RestApiId: !Ref ApiGateway
        DebateStart:
          Type: Api
          Properties:
            Path: /api/debate/start
            Method: post
            RestApiId: !Ref ApiGateway
        DebateSessionStart:
          Type: Api
          Properties:
            Path: /api/debate/session/start
            Method: post
            RestApiId: !Ref ApiGateway
        DebateSessionContinue:
          Type: Api
          Properties:
            Path: /api/debate/session/{debate_id}/continue
            Method: post
            RestApiId: !Ref ApiGateway
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DebatesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CheckinsTable
        - Statement:
            - Effect: Allow
              Action: cognito-idp:DescribeUserPool
              Resource: !GetAtt UserPool.Arn
            - Effect: Allow
              Action:
                - bedrock:ListFoundationModels
              Resource: "*"
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - polly:DescribeVoices
              Resource: "*"
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

  # ── API Gateway ────────────────────────────────────────────────
  CheckinProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: diverge-checkin-processor
      CodeUri: backend/
      Handler: checkin_processor.handler
      Timeout: 60
      MemorySize: 256
      Tracing: Active
      Environment:
        Variables:
          DIVERGE_CHECKINS_TABLE: !Ref CheckinsTable
          DIVERGE_CHECKINS_SCHEDULER_ENABLED: "true"
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CheckinsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Authorization,Content-Type,X-Captcha-Token'"
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn

  # ── S3: Frontend Hosting ───────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub diverge-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── Custom Domain (optional) ──────────────────────────────────
  # ACM cert for CloudFront MUST be in us-east-1 (which is where this stack lives).
  # Cert uses DNS validation; if HostedZoneId is provided, validation is automated.
  CustomDomainCertificate:
    Condition: HasCustomDomain
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasHostedZone
        - - DomainName: !Ref DomainName
            HostedZoneId: !Ref HostedZoneId
        - !Ref AWS::NoValue

  # ── CloudFront CDN ────────────────────────────────────────────
  # NOTE: Requires account verification. Deploy will fail if not verified.
  # Comment out this section if CloudFront is blocked.
  CloudFrontOAC:
    Condition: CreateCloudFront
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: diverge-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Condition: CreateCloudFront
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CustomDomainCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: DebateOrigin
            DomainName: !Select
              - 2
              - !Split ["/", !GetAtt DebateFunctionUrl.FunctionUrl]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub "diverge-${AWS::AccountId}-origin-secret"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
          - Id: ApiOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Stage}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
        CacheBehaviors:
          - PathPattern: "/api/debate/*"
            TargetOriginId: DebateOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          - PathPattern: "/api/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  FrontendBucketPolicy:
    Condition: CreateCloudFront
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ── Route 53 A-Alias to CloudFront (only when HostedZoneId is provided) ──
  # CloudFront's hosted zone ID is the global Z2FDTNDATAQYW2.
  CustomDomainAliasRecord:
    Condition: HasHostedZone
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  # ── Budget + Alarm Notifications ──────────────────────────────
  # SNS topic that receives alarm + budget notifications and forwards by email.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "diverge-${Stage}-alerts"
      DisplayName: Diverge Alerts
      Subscription: !If
        - HasAlertEmail
        - - Endpoint: !Ref AlertEmail
            Protocol: email
        - !Ref AWS::NoValue

  # Hard monthly cost cap. Email at 50%, 80%, and on forecasted overspend.
  # Forecasted alert is the early-warning: AWS predicts you'll overrun before you do.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "diverge-${Stage}-monthly"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers: !If
        - HasAlertEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 50
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref AlertEmail
        - !Ref AWS::NoValue

  BedrockInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: diverge-bedrock-invocations-high
      AlarmDescription: >
        Bedrock invocations exceeded 100/hour — potential abuse or runaway loop.
      Namespace: AWS/Bedrock
      MetricName: Invocations
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: diverge-debate-errors-high
      AlarmDescription: Debate Lambda error rate exceeded 10 in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DebateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Fires when concurrency cap is being hit — early signal of unusual load.
  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: diverge-debate-throttles
      AlarmDescription: Debate Lambda is being throttled (concurrency cap hit).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref DebateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://diverge-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
  ApiUrl:
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  DebateFunctionUrl:
    Value: !GetAtt DebateFunctionUrl.FunctionUrl
  FrontendBucket:
    Value: !Ref FrontendBucket
  CloudFrontDomain:
    Condition: CreateCloudFront
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Condition: CreateCloudFront
    Value: !Ref CloudFrontDistribution
  CustomDomainUrl:
    Condition: HasCustomDomain
    Value: !Sub "https://${DomainName}"
  CustomDomainCertificateArn:
    Condition: HasCustomDomain
    Value: !Ref CustomDomainCertificate
